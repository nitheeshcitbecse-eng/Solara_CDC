# Backup for backend/app/keep_awake.py: pings the Render backend every 10 minutes so the free plan
# doesn't put it to sleep (it sleeps after 15 idle minutes and then needs ~1 minute to wake).
# Free for public repositories. GitHub may start scheduled runs a few minutes late.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 https://solara-cdc.onrender.com/api/v1/health
