# Render Blueprint for the Solara backend (free plan). Render → New → Blueprint → pick this repository.
# Values marked `sync: false` are asked for when the Blueprint is created; nothing secret is stored here.
services:
  - type: web
    name: solara-backend
    runtime: python
    plan: free
    region: singapore          # closest Render region to India; create the Neon project in AWS Singapore too
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SEED_ON_START          # creates the sectors and the admin account (Render free has no shell)
        value: "true"
      - key: DATABASE_URL           # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: owner@solara.app
      - key: ADMIN_PASSWORD         # must not be the default Solara@123 in production
        sync: false
      - key: MYMEMORY_EMAIL         # optional: free translator limit 5,000 → 50,000 characters a day
        sync: false
      - key: AZURE_TRANSLATOR_KEY   # optional: use Azure instead of MyMemory
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        value: centralindia
